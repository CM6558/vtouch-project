name: build-vtouch-plugin-apk

on:
  push:
    paths:
      - 'clients/plugin-apk/**'
      - '.github/workflows/build-vtouch-plugin-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27d (arm64 + x86_64 双 ABI 编译)
        run: |
          curl -fsSLo /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
          sudo mkdir -p /opt/ndk
          sudo unzip -q /tmp/ndk.zip -d /opt/ndk
          echo "ANDROID_NDK_HOME=/opt/ndk/android-ndk-r27d" >> "$GITHUB_ENV"

      - name: Build plugin APK
        run: |
          set -euo pipefail
          echo "sdkmanager install platforms + build-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-24" "build-tools;34.0.0" > /dev/null
          bash clients/plugin-apk/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtouch-plugin-apk
          path: clients/plugin-apk/out/vtouch-plugin.apk
          if-no-files-found: error
