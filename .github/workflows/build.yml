name: Build vtouch (Android NDK)
# arm64: 完整 bundle（内嵌面板 dex/so，可部署到真机）
# x86_64: headless bundle（AVD 测试用；面板 .so 是 arm64 的，x86_64 装不了）
# 本机等价命令见 README「构建」：编译核心 → sh scripts/build_ui.sh → python scripts/build_bundle.py
# → verify_bundle.py（对账）→ package_dist.py（出含文档与调用示例的交付包）

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: r27d
  NDK_TOOLCHAIN_BIN: linux-x86_64
  BUILD_TOOLS_VERSION: "34.0.0"
  API_LEVEL: "24"
  IMGUI_VERSION: v1.91.8          # 与 thirdparty/imgui 同版本，面板编译依赖

jobs:
  build:
    name: Compile vtouchd + panel + bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NDK ${{ env.NDK_VERSION }}
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
          mv /tmp/ndk-extract/android-ndk-${{ env.NDK_VERSION }} \
             "${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}"
          rm -f /tmp/ndk.zip

      - name: Set up toolchain PATH
        run: |
          NDK="${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/${{ env.NDK_TOOLCHAIN_BIN }}/bin" >> "$GITHUB_PATH"

      - name: Cache Dear ImGui ${{ env.IMGUI_VERSION }}
        id: cache-imgui
        uses: actions/cache@v4
        with:
          path: thirdparty/imgui
          key: imgui-${{ env.IMGUI_VERSION }}

      - name: Fetch Dear ImGui ${{ env.IMGUI_VERSION }}
        if: steps.cache-imgui.outputs.cache-hit != 'true'
        run: |
          mkdir -p thirdparty
          git clone --depth 1 -b "${{ env.IMGUI_VERSION }}" \
            https://github.com/ocornut/imgui thirdparty/imgui
          test -f thirdparty/imgui/imgui.h

      - name: Set up JDK 17 (javac + d8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (platform ${{ env.API_LEVEL }} + build-tools ${{ env.BUILD_TOOLS_VERSION }})
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${{ env.API_LEVEL }}" "build-tools;${{ env.BUILD_TOOLS_VERSION }}"
          test -f "$SDK/platforms/android-${{ env.API_LEVEL }}/android.jar"
          test -x "$SDK/build-tools/${{ env.BUILD_TOOLS_VERSION }}/d8"

      - name: Compile vtouchd (merged single binary, arm64)
        run: |
          mkdir -p build
          aarch64-linux-android24-clang -O2 -Wall -Wextra -Werror -D_GNU_SOURCE \
            src/vtouchd.c -o build/vtouchd

      - name: Build panel (classes.dex + libtestimgui.so)
        env:
          NDK_ROOT: ${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}
        run: sh scripts/build_ui.sh

      - name: Generate vtouch_bundle.js (arm64, 带面板)
        run: |
          python3 scripts/build_bundle.py
          test -f clients/vtouch_bundle.js || { echo "bundle not generated"; exit 1; }
          cp clients/vtouch_bundle.js build/vtouch_bundle-arm64.js

      - name: Verify arm64 bundle matches THIS build (内嵌项 vs 刚编出的产物)
        run: |
          set -e
          # 逐字节比对：包内 daemon == build/vtouchd；包内 dex/so md5 == build/ui/*
          python3 scripts/verify_bundle.py \
            --bundle build/vtouch_bundle-arm64.js --bin build/vtouchd --ui build/ui | tee /tmp/verify-arm64.txt
          grep -q "校验通过" /tmp/verify-arm64.txt

      - name: Package dist (bundle + 文档 + 调用示例)
        run: |
          set -e
          # 对账通过后再打包；产物含 README.md（用法说明）与 example.js（可直接跑的示例）
          python3 scripts/package_dist.py \
            --bundle build/vtouch_bundle-arm64.js --bin build/vtouchd --ui build/ui --verify
          ls -l build/dist/ build/dist/*/ || true

      - name: Compile vtouchd x86_64 (AVD 测试) + generate x86_64 headless bundle
        run: |
          x86_64-linux-android24-clang -O2 -Wall -Wextra -Werror -D_GNU_SOURCE \
            src/vtouchd.c -o build/vtouchd-x86_64
          mv build/vtouchd build/vtouchd.arm64
          mv build/vtouchd-x86_64 build/vtouchd
          python3 scripts/build_bundle.py --headless
          cp clients/vtouch_bundle.js build/vtouch_bundle-x86_64-headless.js
          python3 scripts/verify_bundle.py \
            --bundle build/vtouch_bundle-x86_64-headless.js --bin build/vtouchd --allow-headless
          mv build/vtouchd build/vtouchd-x86_64
          mv build/vtouchd.arm64 build/vtouchd

      - name: Verify binaries
        run: |
          set -e
          test -x build/vtouchd || { echo "missing executable: vtouchd"; exit 1; }
          file build/vtouchd
          ls -lh build/
          test -f build/vtouch_bundle-arm64.js || { echo "arm64 bundle missing"; exit 1; }
          test -f build/vtouch_bundle-x86_64-headless.js || { echo "x86_64 bundle missing"; exit 1; }
          # arm64 必须真的带面板（headless 只有 ~40KB，带面板 ~750KB）
          grep -q 'VTOUCH_UI_SO_GZ_B64 = "' build/vtouch_bundle-arm64.js || { echo "arm64 bundle 没有内嵌面板"; exit 1; }
          SIZE=$(stat -c%s build/vtouch_bundle-arm64.js)
          test "$SIZE" -gt 400000 || { echo "arm64 bundle 只有 ${SIZE}B，面板没进去"; exit 1; }
          echo "arm64 bundle ${SIZE}B（含面板）"
          md5sum build/vtouch_bundle-arm64.js build/vtouch_bundle-x86_64-headless.js
          {
            echo "## vtouch 构建产物（commit \`${GITHUB_SHA:0:7}\`）"
            echo
            echo "| 产物 | 大小 | md5 |"
            echo "|---|---|---|"
            for f in build/vtouchd build/vtouch_bundle-arm64.js build/vtouch_bundle-x86_64-headless.js; do
              echo "| \`$f\` | $(stat -c%s "$f") B | \`$(md5sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo "内嵌 daemon = \`build/vtouchd\`（逐字节比对通过）；内嵌面板 dex/so = \`build/ui/*\`（md5 比对通过）。"
            echo "本机构建同一 commit 应得到逐字节相同的 arm64 bundle（已验证可复现的项：libtestimgui.so）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtouch-arm64-binaries
          path: |
            build/vtouchd
            build/vtouch_bundle-arm64.js
            build/vtouch_bundle-x86_64-headless.js
            build/dist/**
          if-no-files-found: error

      - name: Create GitHub Release (release only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/vtouchd
            build/vtouch_bundle-arm64.js
            build/vtouch_bundle-x86_64-headless.js
            build/dist/*.zip
