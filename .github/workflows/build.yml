name: Build vtouch (Android NDK)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: r27d
  NDK_TOOLCHAIN_BIN: linux-x86_64

jobs:
  build:
    name: Compile arm64 binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NDK ${{ env.NDK_VERSION }}
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
          mv /tmp/ndk-extract/android-ndk-${{ env.NDK_VERSION }} \
             "${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}"
          rm -f /tmp/ndk.zip

      - name: Set up toolchain PATH
        run: |
          NDK="${{ runner.tool_cache }}/android-ndk-${{ env.NDK_VERSION }}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/${{ env.NDK_TOOLCHAIN_BIN }}/bin" >> "$GITHUB_PATH"

      - name: Compile vtouchmerge (core merger)
        run: |
          mkdir -p build
          aarch64-linux-android24-clang -O2 -Wall -Wextra -Werror -D_GNU_SOURCE \
            src/vtouchmerge.c -o build/vtouchmerge

      - name: Compile vtouchd (merged single binary)
        run: |
          aarch64-linux-android24-clang -O2 -Wall -Wextra -Werror -D_GNU_SOURCE \
            src/vtouchd.c -o build/vtouchd

      - name: Compile vtouchws (WebSocket bridge)
        run: |
          aarch64-linux-android24-clang -O2 -Wall -Wextra -pthread \
            src/vtouchws.c -o build/vtouchws

      - name: Verify binaries
        run: |
          set -e
          for f in build/vtouchd build/vtouchmerge build/vtouchws; do
            test -x "$f" || { echo "missing executable: $f"; exit 1; }
            file "$f"
          done
          ls -lh build/

      - name: Generate vtouch_bundle.js (embed freshly built vtouchd)
        run: |
          python3 scripts/build_bundle.py
          test -f clients/vtouch_bundle.js || { echo "bundle not generated"; exit 1; }
          ls -lh clients/vtouch_bundle.js

      - name: Package install archives (release only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Refresh the shipped binaries with freshly compiled ones, then rebuild the install zips.
          cp build/vtouchd build/vtouchmerge build/vtouchws sdcard/vtouch-merge/
          python3 scripts/make_install_archives.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtouch-arm64-binaries
          path: |
            build/vtouchd
            build/vtouchmerge
            build/vtouchws
            clients/vtouch_bundle.js
          if-no-files-found: error

      - name: Create GitHub Release (release only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/vtouchd
            build/vtouchmerge
            build/vtouchws
            vtouch-merge-sdcard-latest.zip
            vtouch-merge-install-bundle.zip
