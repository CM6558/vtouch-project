name: build

# 一条流水线产出三样东西，且都**来自本次提交**：
#   ① build/vtouchd        —— 默认核心（不带面板）
#   ② build/vtouchd_ui     —— 带面板的核心（面板三件套内嵌在 .rodata 里）
#   ③ build/vtouch.sh      —— su 脚本（自包含单文件：内嵌 ②；设备侧 装/起/停/状态）
# scripts/ci_check.py 是硬门：产物齐全 + 面板必须 real 模式 + su 内嵌负载对账，
# 对不上就让构建失败。另两道小门：apply_funcdoc.py --check（函数文档幂等，靠退出码判）
# 与字形表两次生成一致。

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 核心 + 面板 + su 脚本
    runs-on: ubuntu-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: JDK 17（面板要 javac）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK（build-tools 34.0.0 + platforms;android-24）
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-24'

      - name: Android NDK r27d
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: ImGui（不入库：按 build_ui.sh 指定的版本自拉）
        run: git clone --depth 1 -b v1.91.8 https://github.com/ocornut/imgui thirdparty/imgui

      - name: 编面板（javac + d8 + NDK clang；**必须 real 模式：接核心**）
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          VTOUCH_UI_CORE: real          # 默认是 stub（面板单跑用的桩）——漏了这个就会发出「面板不接核心」的产物
        run: bash scripts/build_ui.sh

      - name: 编带面板的核心（面板三件套内嵌）
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build.sh ui

      - name: 编默认核心
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build.sh

      - name: 打 su 脚本（自包含单文件，内嵌带面板核心）
        run: python3 scripts/pack_su.py

      - name: 函数文档幂等门（--check 有退出码：0 处调整 + 不变式全满足才算过）
        run: python3 scripts/apply_funcdoc.py --check

      - name: 字形表重生成稳定性（同源码两次生成必须逐字节一致）
        run: |
          python3 scripts/gen_ui_chars.py --out build/ui/ui_chars.h
          md5sum build/ui/ui_chars.h > build/_chars1.md5
          python3 scripts/gen_ui_chars.py --out build/ui/ui_chars.h
          md5sum -c build/_chars1.md5

      - name: 一致性门 + 产物清单
        run: |
          mkdir -p build
          set -o pipefail
          python3 scripts/ci_check.py 2>&1 | tee build/ci_check.txt

      - name: 写 job summary
        if: always()
        run: |
          {
            echo "## vtouch 构建产物（来自 ${{ github.sha }}）"
            echo
            echo '```'
            [ -f build/ci_check.txt ] && cat build/ci_check.txt || echo "(门没跑到，看上面的步骤日志)"
            echo '```'
            echo
            echo "**交付**：\`vtouch.sh\` —— 推到手机 \`/sdcard/vtouch.sh\`，\`su -c 'sh /sdcard/vtouch.sh start'\` 即用"
            echo "（装完回读 md5 对账；面板三件套由核心启动时自解包）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: vtouch
          if-no-files-found: error
          path: |
            build/vtouch.sh
            build/vtouchd
            build/vtouchd_ui
            build/ci_check.txt
