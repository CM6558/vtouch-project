<!DOCTYPE html><meta charset="utf-8"><title>vtouchd 调用图 · 交互阅读版</title>
<style>
  .cg{color:var(--foreground,#1f2937);font:13px/1.5 var(--app-font,system-ui,sans-serif);display:flex;flex-direction:column;gap:8px}
  .cg *{box-sizing:border-box}
  .cg button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border,#d7dde5);border-radius:6px;padding:3px 8px;cursor:pointer}
  .cg button:hover{border-color:var(--accent,#2563eb);color:var(--accent,#2563eb)}
  .cg button.on{background:var(--accent,#2563eb);border-color:var(--accent,#2563eb);color:#fff}
  .cg .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .cg input[type=search]{font:inherit;color:inherit;background:transparent;border:1px solid var(--border,#d7dde5);border-radius:6px;padding:4px 8px;min-width:190px}
  .cg .sep{width:1px;height:20px;background:var(--border,#d7dde5)}
  .cg .muted{color:var(--muted-foreground,#6b7280)}
  .cg .wrap{display:flex;gap:8px;height:560px;border:1px solid var(--border,#d7dde5);border-radius:8px;overflow:hidden}
  .cg .pane{overflow:auto;position:relative}
  .cg #tree{width:270px;flex:none;border-right:1px solid var(--border,#d7dde5);padding:6px 0}
  .cg #stage{flex:1;padding:0}
  .cg #side{width:300px;flex:none;border-left:1px solid var(--border,#d7dde5);padding:8px}
  .cg .mod{font-weight:600;cursor:pointer;padding:4px 8px;display:flex;justify-content:space-between;gap:6px;user-select:none}
  .cg .mod:hover{background:var(--accent,#2563eb);color:#fff;border-radius:4px}
  .cg .fn{padding:2px 8px 2px 18px;cursor:pointer;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cg .fn:hover{background:color-mix(in srgb,var(--accent,#2563eb) 12%,transparent);border-radius:4px}
  .cg .fn.sel{background:var(--accent,#2563eb);color:#fff;border-radius:4px}
  .cg .fn.hit{box-shadow:inset 0 -2px 0 #f59e0b}
  .cg .fn code{font-weight:600}
  .cg .tag{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 3px;opacity:.75}
  .cg svg{display:block}
  .cg .node rect{stroke-width:1.2;cursor:pointer}
  .cg .node text{font:600 11px var(--app-font,system-ui,sans-serif);pointer-events:none}
  .cg .node.dim{opacity:.25}
  .cg path.e{fill:none;stroke-width:1.2;opacity:.10}
  .cg path.e.out{stroke:#3b82f6}
  .cg path.e.in{stroke:#8b5cf6}
  .cg path.e.hot{opacity:.95;stroke-width:1.9}
  .cg #player{border:1px solid var(--border,#d7dde5);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cg #player .step{flex:1;min-width:260px}
  .cg .chip{display:inline-block;border:1px solid var(--border,#d7dde5);border-radius:10px;padding:0 6px;margin:2px 3px 2px 0;font-size:11px;cursor:pointer}
  .cg .chip:hover{border-color:var(--accent,#2563eb);color:var(--accent,#2563eb)}
  .cg h4{margin:6px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .cg .doc{font-size:12px;margin:2px 0 6px}
  .cg .k{color:var(--muted-foreground,#6b7280);font-size:11px}
  .cg .legend{display:flex;gap:10px;align-items:center;font-size:11px}
  .cg .sw{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:4px}
</style>
<div class="cg">
  <div class="bar">
    <input id="q" type="search" placeholder="搜函数名 / 作用关键词，回车跳到第一个">
    <span class="sep"></span>
    <span class="muted">视角</span>
    <button data-focus="all" class="on">全部</button>
    <button data-focus="hop">只看选中一跳</button>
    <button data-focus="chain">只看当前链路</button>
    <span class="sep"></span>
    <label class="legend"><input type="checkbox" id="showOut" checked><span class="sw" style="background:#3b82f6"></span>它调用的</label>
    <label class="legend"><input type="checkbox" id="showIn" checked><span class="sw" style="background:#8b5cf6"></span>调用它的</label>
    <span class="sep"></span>
    <button id="reset">重置</button>
    <span class="sep"></span>
    <span class="muted" id="stat"></span>
  </div>
  <div class="bar" id="modbar"></div>
  <div class="wrap">
    <div class="pane" id="tree"></div>
    <div class="pane" id="stage"><svg id="sv"></svg></div>
    <div class="pane" id="side"></div>
  </div>
  <div id="player">
    <span class="muted">跟着链路读</span>
    <span id="chainbtns"></span>
    <button id="prev">◀ 上一步</button>
    <button id="next">下一步 ▶</button>
    <button id="play">▶ 自动播放</button>
    <span class="step" id="steptxt"></span>
  </div>
</div>
<script>
const D = __DATA__;
const NW = 236, NH = 30, GAPX = 268, GAPY = 34, PADX = 14, PADY = 14;
const N = {}; D.nodes.forEach(n => N[n.id] = n);
const edges = D.edges.map((e, i) => ({...e, i, id: 'e' + i}));
const outOf = {}, inOf = {};
edges.forEach(e => { (outOf[e.a] = outOf[e.a] || []).push(e); (inOf[e.b] = inOf[e.b] || []).push(e); });
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// 版面：模块 = 列（按 src 里的文件顺序），列内按函数定义行号
const colOf = {}; D.mods.forEach((m, i) => colOf[m] = i);
const byMod = {}; D.nodes.forEach(n => (byMod[n.mod] = byMod[n.mod] || []).push(n));
const pos = {}; let maxRows = 0;
D.mods.forEach(m => {
  const list = (byMod[m] || []).sort((a, b) => a.line - b.line);
  maxRows = Math.max(maxRows, list.length);
  list.forEach((n, r) => { pos[n.id] = { x: PADX + colOf[m] * GAPX, y: PADY + r * GAPY, m: colOf[m], r }; });
});
const W = PADX * 2 + D.mods.length * GAPX, H = PADY * 2 + maxRows * GAPY;
const sv = document.getElementById('sv');
sv.setAttribute('viewBox', `0 0 ${W} ${H}`); sv.setAttribute('width', W); sv.setAttribute('height', H);
const fill = { read:['#eff6ff','#3b82f6'], control:['#faf5ff','#8b5cf6'], write:['#f0fdf4','#10b981'],
               data:['#fff7ed','#f97316'], neutral:['#f8fafc','#94a3b8'] };
const flowOf = m => ({'vt_input.c':'read','vt_region.c':'read','vtouchd.c':'control','vt_ws.c':'control',
                      'vt_frame.c':'write','vt_queue.c':'data','vt_util.c':'neutral'}[m] || 'neutral');
const state = { sel:null, hi:null, chain:null, step:-1, focus:'all', showOut:true, showIn:true, mods:new Set(D.mods) };

// ---------- SVG ----------
const svgNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){ const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const gEdge = el('g', {}), gNode = el('g', {});
sv.append(gEdge, gNode);
const edgeEl = {}, nodeEl = {};
function edgePath(e){
  const a = pos[e.a], b = pos[e.b];
  const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  if (a.m === b.m){                                  // 同列：走左侧小弧
    const bx = a.x - 14 - ((e.i % 3) * 6);
    return `M ${x1} ${y1} C ${x1 + 26} ${y1}, ${bx} ${y1}, ${bx} ${(y1 + y2) / 2} C ${bx} ${y2}, ${x2 - 26} ${y2}, ${x2} ${y2}`;
  }
  const mx = (x1 + x2) / 2 + (a.m < b.m ? 20 : -20);
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}
edges.forEach(e => {
  const p = el('path', { d: edgePath(e), class: 'e out', id: e.id });
  p.dataset.a = e.a; p.dataset.b = e.b;
  p.addEventListener('mouseenter', () => { if (!state.sel) { p.classList.add('hot'); const t = N[e.b]; } });
  p.addEventListener('mouseleave', () => { if (!state.sel) p.classList.remove('hot'); });
  edgeEl[e.id] = p; gEdge.append(p);
});
D.nodes.forEach(n => {
  const p = pos[n.id], f = fill[flowOf(n.mod)];
  const g = el('g', { class: 'node', 'data-id': n.id, transform: `translate(${p.x},${p.y})` });
  g.append(el('rect', { x:0, y:0, width:NW, height:NH, rx:6, fill:f[0], stroke:f[1] }));
  const t = el('text', { x:8, y:19, fill:'#111827' }); t.textContent = n.id + '()';
  const cnt = el('text', { x:NW-8, y:19, fill:'#6b7280', 'text-anchor':'end', style:'font-weight:400;font-size:10px' });
  cnt.textContent = (n.in ? '↓' + n.in : '') + (n.out ? ' ↑' + n.out : '');
  g.append(t, cnt);
  const tip = el('title', {}); tip.textContent = n.id + '()\n' + n.brief + '\n' + n.mod + ':' + n.line;
  g.append(tip);
  g.addEventListener('mouseenter', () => { if (!state.sel) hover(n.id); });
  g.addEventListener('mouseleave', () => { if (!state.sel) clearHot(); });
  g.addEventListener('click', () => select(n.id));
  nodeEl[n.id] = g; gNode.append(g);
});

// ---------- 高亮/选择 ----------
function clearHot(){ edges.forEach(e => { const p = edgeEl[e.id]; p.classList.remove('hot'); p.classList.toggle('out', e.a && true); p.classList.remove('in'); }); }
function applyHi(nodeIds, edgeIds){
  D.nodes.forEach(n => nodeEl[n.id].classList.toggle('dim', nodeIds && !nodeIds.has(n.id)));
  edges.forEach(e => { const p = edgeEl[e.id]; const on = !edgeIds || edgeIds.has(e.id); p.classList.toggle('hot', !!edgeIds && edgeIds.has(e.id));
                       p.style.opacity = on ? '' : '.03'; });
}
function hover(id){
  const outs = (outOf[id] || []).filter(e => state.showOut), ins = (inOf[id] || []).filter(e => state.showIn);
  const es = new Set([...outs, ...ins].map(e => e.id));
  const ns = new Set([id, ...outs.map(e => e.b), ...ins.map(e => e.a)]);
  applyHi(ns, es);
  edges.forEach(e => { const p = edgeEl[e.id];
    p.classList.remove('in','out');
    if (es.has(e.id)) p.classList.add(e.a === id ? 'out' : 'in'); else p.classList.add(e.a === id ? 'out' : 'in'); });
  document.getElementById('stat').textContent = `${id}() 调用 ${outOf[id]?.length || 0} 个 · 被 ${inOf[id]?.length || 0} 个调用`;
}
function clearHotAll(){ applyHi(null, null); edges.forEach(e => edgeEl[e.id].style.opacity = ''); }
function select(id){
  state.sel = id; state.chain = null;
  document.querySelectorAll('.fn').forEach(r => r.classList.toggle('sel', r.dataset.id === id));
  hover(id); renderSide(id);
  const focus = state.focus;
  if (focus === 'hop'){ /* hover 已实现一跳高亮 */ }
  if (focus === 'all'){ applyHi(null, null); hover(id); }
}

// ---------- 左侧树 ----------
const tree = document.getElementById('tree');
const modOpen = {};
function renderTree(){
  tree.innerHTML = '';
  const q = document.getElementById('q').value.trim().toLowerCase();
  D.mods.forEach(m => {
    const list = (byMod[m] || []).slice().sort((a,b) => a.line - b.line);
    const hit = list.filter(n => !q || n.id.toLowerCase().includes(q) || (n.brief||'').toLowerCase().includes(q));
    const open = modOpen[m] === undefined ? true : modOpen[m];
    const head = document.createElement('div'); head.className = 'mod';
    head.innerHTML = `<span>${open ? '▾' : '▸'} ${esc(m)} <span class="muted" style="font-weight:400">${esc(D.modTitle[m]||'')}</span></span><span class="muted">${hit.length}</span>`;
    head.onclick = () => { modOpen[m] = !open; renderTree(); };
    tree.append(head);
    if (!open) return;
    hit.forEach(n => {
      const row = document.createElement('div');
      row.className = 'fn' + (state.sel === n.id ? ' sel' : '') + (q && (n.id.toLowerCase().includes(q) || (n.brief||'').toLowerCase().includes(q)) ? ' hit' : '');
      row.dataset.id = n.id;
      row.innerHTML = `<code>${esc(n.id)}</code><span class="muted" style="font-size:11px">↓${n.in} ↑${n.out}</span>` +
        (n.entry ? `<span class="tag">${esc(n.entry)}</span>` : '') +
        (n.thread !== '主线程' ? `<span class="tag">${esc(n.thread.replace('处理器',''))}</span>` : '');
      row.title = n.brief;
      row.onclick = () => select(n.id);
      row.onmouseenter = () => { if (!state.sel) hover(n.id); };
      row.onmouseleave = () => { if (!state.sel) clearHotAll(); };
      tree.append(row);
    });
  });
}

// ---------- 右侧文档 ----------
function renderSide(id){
  const n = N[id], side = document.getElementById('side');
  const chips = (arr, dir) => arr.length
    ? arr.map(e => `<span class="chip" data-go="${esc(dir === 'out' ? e.b : e.a)}">${dir === 'out' ? '→' : '←'} ${esc(dir === 'out' ? e.b : e.a)}()${e.n > 1 ? ' ×' + e.n : ''}</span>`).join('')
    : '<span class="muted">—</span>';
  side.innerHTML = `<h4>${esc(n.id)}()</h4>
    <div class="k">${esc(n.mod)}:${n.line} · ${esc(n.thread)}${n.entry ? ' · ' + esc(n.entry) : ''}</div>
    <div class="doc">${esc(n.brief)}</div>
    ${(n.params||[]).length ? '<div class="k">参数</div>' + n.params.map(p => `<div class="doc"><code>${esc(p[0])}</code> — ${esc(p[1])}</div>`).join('') : ''}
    ${n.ret ? `<div class="k">返回</div><div class="doc">${esc(n.ret)}</div>` : ''}
    ${n.note ? `<div class="k">注意</div><div class="doc">${esc(n.note)}</div>` : ''}
    <div class="k">调用它的人（点击继续往上走）</div><div>${chips(inOf[id]||[], 'in')}</div>
    <div class="k" style="margin-top:6px">它调用的人（点击继续往下走）</div><div>${chips(outOf[id]||[], 'out')}</div>
    ${(n.libc||[]).length ? `<div class="k" style="margin-top:6px">用到的系统/库调用</div><div class="k">${n.libc.map(esc).join(' · ')}</div>` : ''}`;
  side.querySelectorAll('.chip').forEach(c => c.onclick = () => select(c.dataset.go));
}

// ---------- 链路播放器 ----------
const chainbtns = document.getElementById('chainbtns');
D.chains.forEach((c, i) => {
  const b = document.createElement('button'); b.textContent = c.title;
  b.onclick = () => startChain(i); chainbtns.append(b);
});
function startChain(i){ state.chain = i; state.step = 0; state.sel = null; playChainBtn(); }
function playChainBtn(){
  [...chainbtns.children].forEach((b, k) => b.classList.toggle('on', state.chain === k));
  const c = D.chains[state.chain]; if (!c) return;
  const step = Math.max(0, Math.min(state.step, c.path.length - 2));
  state.step = step;
  const a = c.path[step], b = c.path[step + 1];
  const ids = new Set(c.path); const es = new Set();
  const e = edges.find(x => x.a === a && x.b === b); if (e) es.add(e.id);
  applyHi(ids, es);
  edges.forEach(x => { const p = edgeEl[x.id]; p.classList.remove('in','out'); p.classList.add(es.has(x.id) ? (x.a === a && x.b === b ? 'in' : 'out') : 'out'); });
  D.nodes.forEach(n => nodeEl[n.id].classList.toggle('dim', !ids.has(n.id)));
  nodeEl[a].querySelector('rect').setAttribute('stroke-width', 3);
  document.getElementById('steptxt').innerHTML =
    `<b>${step + 2}/${c.path.length}</b> · <code>${esc(a)}()</code> → <code>${esc(b)}()</code>` +
    `${e && e.n > 1 ? ' <span class="muted">(' + e.n + ' 处)</span>' : ''} · ${esc(N[b].brief)}` +
    `<div class="muted">${esc(c.desc)}</div>`;
  const row = [...document.querySelectorAll('.fn')].find(r => r.dataset.id === b);
  if (row) row.scrollIntoView({block:'nearest'});
  renderSide(b);
}
document.getElementById('prev').onclick = () => { if (state.chain == null) return; state.step = Math.max(0, state.step - 1); playChainBtn(); };
document.getElementById('next').onclick = () => { if (state.chain == null) return; const c = D.chains[state.chain];
  state.step = Math.min(c.path.length - 2, state.step + 1); playChainBtn(); };
let timer = null;
document.getElementById('play').onclick = e => {
  if (timer){ clearInterval(timer); timer = null; e.target.textContent = '▶ 自动播放'; return; }
  if (state.chain == null) startChain(0);
  e.target.textContent = '⏸ 暂停';
  timer = setInterval(() => { const c = D.chains[state.chain];
    if (state.step >= c.path.length - 2){ clearInterval(timer); timer = null; document.getElementById('play').textContent = '▶ 自动播放'; return; }
    state.step++; playChainBtn(); }, 1800);
};

// ---------- 工具栏 ----------
const modbar = document.getElementById('modbar');
D.mods.forEach(m => { const b = document.createElement('button'); b.textContent = `${m} (${(byMod[m]||[]).length})`; b.classList.add('on');
  b.onclick = () => { if (state.mods.has(m)) state.mods.delete(m); else state.mods.add(m); b.classList.toggle('on'); applyMods(); }; modbar.append(b); });
function applyMods(){ D.nodes.forEach(n => nodeEl[n.id].style.display = state.mods.has(n.mod) ? '' : 'none');
  edges.forEach(e => edgeEl[e.id].style.display = (state.mods.has(N[e.a].mod) && state.mods.has(N[e.b].mod)) ? '' : 'none');
  document.getElementById('stat').textContent = `显示 ${[...state.mods].reduce((s,m)=>s+(byMod[m]||[]).length,0)} / ${D.nodes.length} 个函数`; }
document.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => {
  state.focus = b.dataset.focus; document.querySelectorAll('[data-focus]').forEach(x => x.classList.toggle('on', x === b));
  if (state.focus === 'chain' && state.chain != null) playChainBtn();
  else if (state.sel) select(state.sel); else { clearHotAll(); document.getElementById('stat').textContent = '全部调用关系已淡出显示'; }
});
document.getElementById('showOut').onchange = e => { state.showOut = e.target.checked; state.sel ? select(state.sel) : clearHotAll(); };
document.getElementById('showIn').onchange = e => { state.showIn = e.target.checked; state.sel ? select(state.sel) : clearHotAll(); };
document.getElementById('reset').onclick = () => { state.sel = null; state.chain = null; state.step = -1;
  document.querySelectorAll('.fn').forEach(r => r.classList.remove('sel')); clearHotAll();
  document.getElementById('side').innerHTML = '<h4>怎么用</h4><div class="doc">三种用法：① 左边点函数名 → 中间高亮它的一跳、右边出文档；② 悬停任意节点/行 → 只点亮相关调用；③ 底部「跟着链路读」→ 逐步播放一条真实链路的每一步。</div><div class="k">键盘：← → 换步，/ 聚焦搜索，Esc 清除选择</div>';
  document.getElementById('stat').textContent = ''; };
document.getElementById('q').oninput = renderTree;
document.getElementById('q').onkeydown = e => { if (e.key === 'Enter'){ const f = document.querySelector('.fn.hit'); if (f) select(f.dataset.id); } };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  else if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  else if (e.key === 'Escape') document.getElementById('reset').click();
  else if (e.key === '/'){ e.preventDefault(); document.getElementById('q').focus(); }
});
// 初始：先给一张「全部边淡出、节点都在」的干净底图 + 用法说明
renderTree();
document.getElementById('reset').click();
document.getElementById('stat').textContent = `共 ${D.nodes.length} 个函数 · ${edges.length} 条调用边 · 5 条可播放链路`;
</script>
